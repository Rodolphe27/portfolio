<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="DejaVu Sans, Liberation Sans, Arial, sans-serif">
  <defs>
    <radialGradient id="glow1" cx="12%" cy="0%" r="70%">
      <stop offset="0%" stop-color="#4f9eff" stop-opacity="0.16"/>
      <stop offset="60%" stop-color="#4f9eff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="92%" cy="100%" r="60%">
